name: Renovate

on:
  schedule:
    # Daily at 21:00 UTC (22:00/23:00 Amsterdam). The preset only lets Renovate open,
    # rebase and auto-merge PRs in the Saturday-night window, so weekday runs just
    # refresh the Dependency Dashboard and handle security alerts.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        type: choice
        default: "info"
        options: [debug, info, warn, error]
      dryRun:
        description: "Renovate dryRun mode"
        type: choice
        default: live
        options: [live, extract, lookup, full]
      autodiscoverFilter:
        description: "Limit to repos, e.g. a14a-org/{repo-a,repo-b} (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.4
        with:
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'live' && inputs.dryRun || '' }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ inputs.autodiscoverFilter || '' }}
