name: Renovate

on:
  schedule:
    # Daily at 21:00 UTC: dashboards and security alerts. On Saturdays this run is
    # also the first one inside the preset window (Sat 22:00 - Sun 06:00 Amsterdam).
    - cron: "0 21 * * *"
    # Extra in-window runs so a PR that conflicts after an earlier merge is rebased
    # the same night instead of a week later. Valid in both CEST and CET.
    - cron: "30 23 * * 6"
    - cron: "30 1,2 * * 0"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        type: choice
        default: "info"
        options: [debug, info, warn, error]
      dryRun:
        description: "Renovate dryRun mode"
        type: choice
        default: live
        options: [live, extract, lookup, full]
      autodiscoverFilter:
        description: "Limit to repos, e.g. a14a-org/{repo-a,repo-b} (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
        with:
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'live' && inputs.dryRun || '' }}
          # Staged rollout: the repo variable limits scheduled runs to a pilot set; delete it to cover the whole org.
          RENOVATE_AUTODISCOVER_FILTER: ${{ inputs.autodiscoverFilter || vars.RENOVATE_AUTODISCOVER_FILTER || '' }}
